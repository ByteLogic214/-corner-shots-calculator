name: Quantitative Multi-Model Betting Engine

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: 'Equipo Local (Ej. Real Madrid)'
        required: true
        type: string
      away_team:
        description: 'Equipo Visitante (Ej. Barcelona)'
        required: true
        type: string
      match_id:
        description: 'Match ID oficial en TheStatsAPI (Opcional)'
        required: false
        type: string
      odds_corners:
        description: 'Cuota Over 9.5 Corners'
        required: false
        default: '0.0'
        type: string
      is_live:
        description: '¿Es partido In-Play?'
        required: false
        default: 'false' # CORRECCIÓN: Los valores por defecto siempre van entre comillas en GitHub Actions
        type: boolean
      current_minute:
        description: 'Minuto actual (In-Play)'
        required: false
        default: '0'
        type: string

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Machine Learning Pipeline
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_HOME: ${{ inputs.home_team }}
          INPUT_AWAY: ${{ inputs.away_team }}
          INPUT_MATCH_ID: ${{ inputs.match_id }}
          INPUT_ODDS: ${{ inputs.odds_corners }}
          INPUT_LIVE: ${{ inputs.is_live }}
          INPUT_MINUTE: ${{ inputs.current_minute }}
        run: |
          python main.py \
            --home "$INPUT_HOME" \
            --away "$INPUT_AWAY" \
            --match-id "$INPUT_MATCH_ID" \
            --odds-corners "$INPUT_ODDS" \
            --live "$INPUT_LIVE" \
            --minute "$INPUT_MINUTE"
